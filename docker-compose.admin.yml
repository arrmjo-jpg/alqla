# ── alqalahnews-admin — independent Coolify Application ─────────────────────────────────────────
#
# No build-time dependency on backend being live — Vite bakes VITE_API_BASE_URL as a plain string
# into the compiled bundle, it never makes a network call during `npm run build`. This Application
# can deploy at any time, independently of backend/frontend/workers' state.
#
# ⚠️ CUTOVER, NOT YET LIVE: domain below is a TEMPORARY testing subdomain — see
# docker-compose.backend.yml's header comment for the full explanation.

services:
  alqalahnews-admin:
    image: alqalahnews-admin:latest
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required — e.g. https://api-new.alpha-cms.shop/api/v1}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:?VITE_PUBLIC_SITE_URL is required — e.g. https://new.alpha-cms.shop}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.alqalahnews-admin.rule=Host(`admin-new.alpha-cms.shop`)
      - traefik.http.routers.alqalahnews-admin.entrypoints=https
      - traefik.http.routers.alqalahnews-admin.tls=true
      - traefik.http.routers.alqalahnews-admin.tls.certresolver=letsencrypt
      - traefik.http.services.alqalahnews-admin.loadbalancer.server.port=80
